name: Tests de las skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Instalar dependencias
        run: |
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-liberation
      - name: Tests rápidos (láminas, glosario, biblioteca, SKILL.md)
        run: python -m pytest -m "not pdf"
      - name: Tests de PDF
        run: python -m pytest -m pdf
