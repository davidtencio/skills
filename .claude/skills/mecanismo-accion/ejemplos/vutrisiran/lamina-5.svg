<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Vutrisiran, lámina 5: Horas en el plasma, meses de efecto</title><desc id="desc">Vutrisiran desaparece del plasma en un día, pero la TTR sigue baja durante todo el intervalo de 3 meses.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">VUTRISIRAN · LÁMINA 5 DE 8 · FARMACOCINÉTICA</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Horas en el plasma, meses de efecto</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Vutrisiran desaparece del plasma en un día, pero la TTR sigue baja durante todo el intervalo de 3 meses.</tspan></text><text x="40.0" y="160.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Dos relojes distintos (esquema cualitativo)</tspan></text><line x1="110" y1="200" x2="110" y2="620" stroke="#3E4C55" stroke-width="2"/><line x1="110" y1="620" x2="770" y2="620" stroke="#3E4C55" stroke-width="2"/><text x="770.0" y="672.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#56656D" text-anchor="end"><tspan x="770.0" dy="0.0">tiempo →</tspan></text><line x1="130" y1="620" x2="130" y2="628" stroke="#3E4C55" stroke-width="2"/><text x="130.0" y="646.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#56656D" text-anchor="middle"><tspan x="130.0" dy="0.0">dosis</tspan></text><path d="M130,620 L134,240 L144,618" fill="#0072B2" fill-opacity="0.18" stroke="#0072B2" stroke-width="2.4"/><line x1="430" y1="620" x2="430" y2="628" stroke="#3E4C55" stroke-width="2"/><text x="430.0" y="646.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#56656D" text-anchor="middle"><tspan x="430.0" dy="0.0">3 meses</tspan></text><path d="M430,620 L434,240 L444,618" fill="#0072B2" fill-opacity="0.18" stroke="#0072B2" stroke-width="2.4"/><line x1="730" y1="620" x2="730" y2="628" stroke="#3E4C55" stroke-width="2"/><text x="730.0" y="646.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#56656D" text-anchor="middle"><tspan x="730.0" dy="0.0">6 meses</tspan></text><path d="M730,620 L734,240 L744,618" fill="#0072B2" fill-opacity="0.18" stroke="#0072B2" stroke-width="2.4"/><text x="154.0" y="234.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="154.0" dy="0.0">vutrisiran en plasma: horas</tspan></text><polyline points="130,290 140,336 150,373 160,402 170,425 180,444 190,459 200,471 210,481 220,489 230,495 240,500 250,504 260,507 270,510 280,512 290,513 300,515 310,516 320,517 330,517 340,518 350,518 360,519 370,519 380,519 390,519 400,519 410,520 420,520 430,520 440,520 450,520 460,520 470,520 480,520 490,520 500,520 510,520 520,520 530,520 540,520 550,520 560,520 570,520 580,520 590,520 600,520 610,520 620,520 630,520 640,520 650,520 660,520 670,520 680,520 690,520 700,520 710,520 720,520 730,520 740,520 750,520 760,520 770,520" fill="none" stroke="#00785A" stroke-width="3.4"/><text x="150.0" y="562.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="150.0" dy="0.0">TTR en suero:</tspan><tspan x="150.0" dy="18.2">se mantiene baja</tspan></text><text x="770.0" y="186.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="end" font-style="italic"><tspan x="770.0" dy="0.0">Eje: TTR (verde). Picos azules sin escala.</tspan></text><text x="96.0" y="296.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="end"><tspan x="96.0" dy="0.0">basal</tspan></text><text x="96.0" y="526.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="end"><tspan x="96.0" dy="0.0">−80 %</tspan></text><text x="40.0" y="690.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">El efecto depende de la cantidad de vutrisiran en el hígado, no en el plasma:</tspan><tspan x="40.0" dy="23.8">por eso basta una inyección cada 3 meses.</tspan></text><line x1="800" y1="140" x2="800" y2="830" stroke="#D3DCE0" stroke-width="1.5"/><rect x="830" y="150" width="730" height="300" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="830" y="150" width="8" height="300" rx="4" fill="#0072B2"/><text x="862.0" y="196.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="862.0" dy="0.0">El fármaco</tspan></text><text x="862.0" y="234.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="862.0" dy="0.0">• Absorción subcutánea rápida: tmáx ≈ 3 h.</tspan><tspan x="862.0" dy="24.6">• Se distribuye sobre todo al hígado; unión a</tspan><tspan x="862.0" dy="24.6">  proteínas &gt; 80 %.</tspan><tspan x="862.0" dy="24.6">• Nucleasas lo cortan en fragmentos; no lo</tspan><tspan x="862.0" dy="24.6">  metaboliza el CYP450.</tspan><tspan x="862.0" dy="24.6">• Semivida plasmática ≈ 5 h; 15–25 % sale</tspan><tspan x="862.0" dy="24.6">  intacto por la orina. No se acumula en plasma.</tspan></text><rect x="830" y="480" width="730" height="300" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="830" y="480" width="8" height="300" rx="4" fill="#00785A"/><text x="862.0" y="526.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="862.0" dy="0.0">El efecto</tspan></text><text x="862.0" y="564.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="862.0" dy="0.0">• TTR sérica: −73 % a la semana 6, −83 % a los</tspan><tspan x="862.0" dy="24.6">  9 meses y −88 % a los 18 meses (HELIOS-A).</tspan><tspan x="862.0" dy="24.6">• Vitamina A sérica: −62 a −70 %, porque baja</tspan><tspan x="862.0" dy="24.6">  su transportador (TTR–RBP4).</tspan><tspan x="862.0" dy="24.6">• Sin interacciones previstas (ni CYP ni</tspan><tspan x="862.0" dy="24.6">  transportadores); sin ajuste en insuficiencia</tspan><tspan x="862.0" dy="24.6">  renal o hepática leve a moderada.</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: ficha técnica de Amvuttra (CIMA-AEMPS); FDA (Amvuttra, tafamidis, acoramidis, patisiran, eplontersen); UniProt P02766, Q9UKV8, P07306; PMID 36345805. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0). Curvas: esquema, no datos.</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión farmacológica</tspan></text></svg>