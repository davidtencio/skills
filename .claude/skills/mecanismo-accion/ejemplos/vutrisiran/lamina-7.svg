<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Vutrisiran, lámina 7: Indicaciones aprobadas: de los nervios al corazón</title><desc id="desc">Aprobaciones de la FDA (Drugs@FDA, NDA 215515) y su presencia en la ficha europea (CIMA 4.1).</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">VUTRISIRAN · LÁMINA 7 DE 8 · INDICACIONES</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Indicaciones aprobadas: de los nervios al corazón</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Aprobaciones de la FDA (Drugs@FDA, NDA 215515) y su presencia en la ficha europea (CIMA 4.1).</tspan></text><line x1="140" y1="300" x2="1460" y2="300" stroke="#D3DCE0" stroke-width="6" stroke-linecap="round"/><circle cx="260" cy="300" r="14" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="260.0" y="230.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="260.0" dy="0.0">06/2022</tspan></text><rect x="216" y="244" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.16"/><text x="260.0" y="261.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="260.0" dy="0.0">UE: sí</tspan></text><text x="260.0" y="344.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="260.0" dy="0.0">Polineuropatía de la</tspan><tspan x="260.0" dy="21.6">ATTR hereditaria (adultos)</tspan></text><circle cx="1340" cy="300" r="14" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="1340.0" y="230.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="1340.0" dy="0.0">03/2025</tspan></text><rect x="1296" y="244" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.16"/><text x="1340.0" y="261.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="1340.0" dy="0.0">UE: sí</tspan></text><text x="1340.0" y="344.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="1340.0" dy="0.0">Miocardiopatía de la ATTR</tspan><tspan x="1340.0" dy="21.6">nativa o hereditaria (adultos)</tspan></text><text x="800.0" y="284.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#56656D" text-anchor="middle"><tspan x="800.0" dy="0.0">FDA</tspan></text><rect x="40" y="430" width="740" height="220" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="430" width="8" height="220" rx="4" fill="#00785A"/><text x="72.0" y="476.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="72.0" dy="0.0">HELIOS-A (polineuropatía)</tspan></text><text x="72.0" y="514.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">Abierto, frente a patisiran y un placebo externo (APOLLO);</tspan><tspan x="72.0" dy="24.6">122 pacientes con vutrisiran, 22 variantes de TTR.</tspan><tspan x="72.0" dy="24.6">mNIS+7 a 18 meses: −0,5 frente a +28,1 puntos.</tspan><tspan x="72.0" dy="24.6">UE: solo estadio 1 o 2 de polineuropatía.</tspan></text><rect x="820" y="430" width="740" height="220" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="820" y="430" width="8" height="220" rx="4" fill="#00785A"/><text x="852.0" y="476.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="852.0" dy="0.0">HELIOS-B (miocardiopatía)</tspan></text><text x="852.0" y="514.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">Doble ciego frente a placebo, 654 pacientes; 89 % ATTRwt,</tspan><tspan x="852.0" dy="24.6">40 % ya tomaba tafamidis. Muerte y eventos CV:</tspan><tspan x="852.0" dy="24.6">HR 0,72 (global) y 0,67 (sin tafamidis).</tspan><tspan x="852.0" dy="24.6">FDA: para reducir mortalidad CV y hospitalizaciones.</tspan></text><rect x="40" y="670" width="1520" height="150" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="670" width="8" height="150" rx="4" fill="#0072B2"/><text x="72.0" y="716.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="72.0" dy="0.0">Cómo leer esta lámina</tspan></text><text x="72.0" y="754.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">La FDA y la EMA aprueban por separado; ambas incluyen hoy las dos indicaciones. En Costa Rica rige el registro</tspan><tspan x="72.0" dy="24.6">sanitario nacional.</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: ficha técnica de Amvuttra (CIMA-AEMPS); FDA (Amvuttra, tafamidis, acoramidis, patisiran, eplontersen); UniProt P02766, Q9UKV8, P07306; PMID 36345805. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0). Drugs@FDA.</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión farmacológica</tspan></text></svg>