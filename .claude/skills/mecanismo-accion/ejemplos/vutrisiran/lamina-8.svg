<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Vutrisiran, lámina 8: Del ensayo a la práctica: valor y vida real</title><desc id="desc">Qué dicen las evaluaciones económicas y los estudios en la práctica clínica, con prioridad para Latinoamérica.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">VUTRISIRAN · LÁMINA 8 DE 8 · VALOR Y VIDA REAL</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Del ensayo a la práctica: valor y vida real</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Qué dicen las evaluaciones económicas y los estudios en la práctica clínica, con prioridad para Latinoamérica.</tspan></text><text x="40.0" y="160.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="40.0" dy="0.0">¿Vale lo que cuesta? · Farmacoeconomía</tspan></text><rect x="40" y="178" width="740" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="40" y="178" width="6" height="112" rx="3" fill="#00785A"/><text x="62.0" y="206.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="62.0" dy="0.0">Reino Unido (NICE): polineuropatía</tspan></text><text x="62.0" y="230.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="62.0" dy="0.0">Recomendado en estadio 1–2 con acuerdo comercial. Precio de lista:</tspan><tspan x="62.0" dy="21.0">£95 862 por jeringa (≈ £383 449 al año).</tspan></text><text x="62.0" y="278.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="62.0" dy="0.0">NICE TA868, 2023</tspan></text><rect x="40" y="300" width="740" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="40" y="300" width="6" height="112" rx="3" fill="#00785A"/><text x="62.0" y="328.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="62.0" dy="0.0">Reino Unido (NICE): miocardiopatía</tspan></text><text x="62.0" y="352.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="62.0" dy="0.0">Puede usarse con acuerdo comercial; elegir la opción más barata</tspan><tspan x="62.0" dy="21.0">entre vutrisiran y tafamidis.</tspan></text><text x="62.0" y="400.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="62.0" dy="0.0">NICE TA1115, 2025</tspan></text><rect x="40" y="422" width="740" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="40" y="422" width="6" height="112" rx="3" fill="#00785A"/><text x="62.0" y="450.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="62.0" dy="0.0">Canadá (CDA-AMC): miocardiopatía</tspan></text><text x="62.0" y="474.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="62.0" dy="0.0">Reembolso con condiciones, entre ellas que su costo no supere</tspan><tspan x="62.0" dy="21.0">al de tafamidis y que no se combinen.</tspan></text><text x="62.0" y="522.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="62.0" dy="0.0">Recomendación de reembolso · PMID 42118893, 2026</tspan></text><line x1="800" y1="140" x2="800" y2="830" stroke="#D3DCE0" stroke-width="1.5"/><text x="830.0" y="160.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="830.0" dy="0.0">¿Funciona igual fuera del ensayo? · Vida real</tspan></text><rect x="830" y="178" width="730" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="830" y="178" width="6" height="112" rx="3" fill="#0072B2"/><text x="852.0" y="206.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="852.0" dy="0.0">EE. UU.: reclamaciones de seguros, 111 pacientes</tspan></text><text x="852.0" y="230.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">Seguimiento medio de 1,5 años: el 37 % fue hospitalizado. En 12</tspan><tspan x="852.0" dy="21.0">meses, el 12 % murió y otro 12 % suspendió el tratamiento.</tspan></text><text x="852.0" y="278.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="852.0" dy="0.0">Estudio retrospectivo (Optum) · PMID 42455256, 2026</tspan></text><rect x="830" y="300" width="730" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="830" y="300" width="6" height="112" rx="3" fill="#0072B2"/><text x="852.0" y="328.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="852.0" dy="0.0">Metaanálisis: terapias dirigidas en miocardiopatía</tspan></text><text x="852.0" y="352.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">Ensayos y estudios comparativos (5 203 pacientes): −39 % de</tspan><tspan x="852.0" dy="21.0">mortalidad con el conjunto de tratamientos dirigidos.</tspan></text><text x="852.0" y="400.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="852.0" dy="0.0">10 estudios · PMID 41311351, 2025</tspan></text><rect x="830" y="426" width="730" height="160" rx="12" fill="#FFF4EE" stroke="#9A6A00" stroke-width="1.4"/><text x="852.0" y="456.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#9A6A00" text-anchor="start"><tspan x="852.0" dy="0.0">Cómo leer estos datos</tspan></text><text x="852.0" y="480.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">• Precio, umbral y comparador cambian con el país y el año.</tspan><tspan x="852.0" dy="21.0">• Los estudios observacionales muestran asociaciones, no causas.</tspan><tspan x="852.0" dy="21.0">• Latinoamérica: no se hallaron evaluaciones económicas ni</tspan><tspan x="852.0" dy="21.0">  estudios de vida real publicados en PubMed.</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: ficha técnica de Amvuttra (CIMA-AEMPS); FDA (Amvuttra, tafamidis, acoramidis, patisiran, eplontersen); UniProt P02766, Q9UKV8, P07306; PMID 36345805. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0).</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión farmacológica</tspan></text></svg>