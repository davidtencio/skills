<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Atorvastatina, lámina 6: Del ensayo a la práctica: valor y vida real</title><desc id="desc">Qué dicen las evaluaciones económicas y los estudios en la práctica clínica, con prioridad para Latinoamérica.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">ATORVASTATINA · LÁMINA 6 DE 6 · VALOR Y VIDA REAL</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Del ensayo a la práctica: valor y vida real</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Qué dicen las evaluaciones económicas y los estudios en la práctica clínica, con prioridad para Latinoamérica.</tspan></text><text x="40.0" y="160.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="40.0" dy="0.0">¿Vale lo que cuesta? · Farmacoeconomía</tspan></text><rect x="40" y="178" width="740" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="40" y="178" width="6" height="112" rx="3" fill="#00785A"/><text x="62.0" y="206.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="62.0" dy="0.0">Medicamento esencial (OMS) y compra conjunta (OPS)</tspan></text><text x="62.0" y="230.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="62.0" dy="0.0">En la Lista de la OMS como equivalente de simvastatina y en</tspan><tspan x="62.0" dy="21.0">polipíldoras; el Fondo Estratégico de la OPS incluye 40 y 80 mg.</tspan></text><text x="62.0" y="278.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="62.0" dy="0.0">OMS, Lista Modelo (eEML) · OPS, precios de referencia 2026</tspan></text><rect x="40" y="300" width="740" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="40" y="300" width="6" height="112" rx="3" fill="#00785A"/><text x="62.0" y="328.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="62.0" dy="0.0">Brasil (SUS): ¿qué intensidad conviene?</tspan></text><text x="62.0" y="352.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="62.0" dy="0.0">Intensidad intermedia (p. ej., atorvastatina 10 mg): &lt; Int$ 10 000</tspan><tspan x="62.0" dy="21.0">por AVAC; alta frente a intermedia: &gt; Int$ 27 000 por AVAC.</tspan></text><text x="62.0" y="400.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="62.0" dy="0.0">Umbral: PIB per cápita (~Int$ 11 770) · PMID 25409878, 2015</tspan></text><rect x="40" y="422" width="740" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="40" y="422" width="6" height="112" rx="3" fill="#00785A"/><text x="62.0" y="450.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="62.0" dy="0.0">Brasil y Colombia: atorvastatina frente a rosuvastatina</tspan></text><text x="62.0" y="474.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="62.0" dy="0.0">En Colombia, pasar a rosuvastatina costaría &gt; 200 000 $ por AVAC</tspan><tspan x="62.0" dy="21.0">ganado: resultados parecidos, precio mucho mayor.</tspan></text><text x="62.0" y="522.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="62.0" dy="0.0">Precios reales de cada país · PMID 29702787, 2014</tspan></text><rect x="40" y="544" width="740" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="40" y="544" width="6" height="112" rx="3" fill="#00785A"/><text x="62.0" y="572.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="62.0" dy="0.0">Reino Unido (NICE) y precio de referencia</tspan></text><text x="62.0" y="596.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="62.0" dy="0.0">Estatinas de alta intensidad: coste-efectivas; atorvastatina 20 mg</tspan><tspan x="62.0" dy="21.0">en prevención primaria. Genérico en EE. UU.: US$ 0,02–0,07/comp.</tspan></text><text x="62.0" y="644.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="62.0" dy="0.0">NICE NG238, 2023 · NADAC (Medicaid), septiembre de 2026</tspan></text><line x1="800" y1="140" x2="800" y2="830" stroke="#D3DCE0" stroke-width="1.5"/><text x="830.0" y="160.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="830.0" dy="0.0">¿Funciona igual fuera del ensayo? · Vida real</tspan></text><rect x="830" y="178" width="730" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="830" y="178" width="6" height="112" rx="3" fill="#0072B2"/><text x="852.0" y="206.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="852.0" dy="0.0">Costa Rica (CRELES): la brecha de control</tspan></text><text x="852.0" y="230.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">En adultos mayores con diabetes, el 78 % tenía LDL ≥ 100 mg/dl:</tspan><tspan x="852.0" dy="21.0">la eficacia del ensayo no garantiza el control en la población.</tspan></text><text x="852.0" y="278.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="852.0" dy="0.0">Muestra nacional de ≥ 60 años, n = 542 · PMID 18447930, 2008</tspan></text><rect x="830" y="300" width="730" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="830" y="300" width="6" height="112" rx="3" fill="#0072B2"/><text x="852.0" y="328.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="852.0" dy="0.0">Brasil: prescripción en un hospital público</tspan></text><text x="852.0" y="352.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">9 594 pacientes con estatina: 18 % sin LDL reciente y 2,4 %</tspan><tspan x="852.0" dy="21.0">con LDL ≥ 190 mg/dl. Solo simvastatina (77,6 %) y atorvastatina.</tspan></text><text x="852.0" y="400.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="852.0" dy="0.0">Estudio retrospectivo · PMID 33886720, 2021</tspan></text><rect x="830" y="422" width="730" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="830" y="422" width="6" height="112" rx="3" fill="#0072B2"/><text x="852.0" y="450.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="852.0" dy="0.0">Brasil (ELSA-Brasil MSK): ¿dolor muscular?</tspan></text><text x="852.0" y="474.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">En 2 156 personas, el uso de estatinas no se asoció con dolor</tspan><tspan x="852.0" dy="21.0">ni debilidad muscular en el análisis principal.</tspan></text><text x="852.0" y="522.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="852.0" dy="0.0">Estudio transversal de una cohorte · PMID 37261675, 2024</tspan></text><rect x="830" y="548" width="730" height="186" rx="12" fill="#FFF4EE" stroke="#9A6A00" stroke-width="1.4"/><text x="852.0" y="578.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#9A6A00" text-anchor="start"><tspan x="852.0" dy="0.0">Cómo leer estos datos</tspan></text><text x="852.0" y="602.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">• Precio, umbral y comparador cambian con el país y el año.</tspan><tspan x="852.0" dy="21.0">• Los estudios observacionales muestran asociaciones, no causas:</tspan><tspan x="852.0" dy="21.0">  confirman o matizan los ensayos, no los sustituyen.</tspan><tspan x="852.0" dy="21.0">• Costa Rica: los precios adjudicados por la CCSS están en SICOP</tspan><tspan x="852.0" dy="21.0">  (se añaden con la skill de estudio de mercado).</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: fichas técnicas de atorvastatina (CIMA, FDA), UniProt P04035, Reactome R-HSA-1655829, PMID 20566875. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0). Estructuras: RDKit/PubChem. Lámina 6: fuentes en cada ficha.</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión farmacológica</tspan></text></svg>