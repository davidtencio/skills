<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Durvalumab, lámina 5: Indicaciones aprobadas: de la enfermedad avanzada a la cirugía</title><desc id="desc">Aprobaciones de la FDA (Drugs@FDA, BLA 761069) en orden cronológico y si constan en la ficha europea (CIMA 4.1).</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">DURVALUMAB · LÁMINA 5 DE 6 · INDICACIONES</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Indicaciones aprobadas: de la enfermedad avanzada a la cirugía</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Aprobaciones de la FDA (Drugs@FDA, BLA 761069) en orden cronológico y si constan en la ficha europea (CIMA 4.1).</tspan></text><line x1="60" y1="400" x2="1540" y2="400" stroke="#D3DCE0" stroke-width="6" stroke-linecap="round"/><text x="60.0" y="618.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="60.0" dy="0.0">← Al principio: enfermedad avanzada ya tratada</tspan></text><text x="1540.0" y="618.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#56656D" text-anchor="end" font-style="italic"><tspan x="1540.0" dy="0.0">Ahora: primera línea y tratamiento alrededor de la cirugía →</tspan></text><line x1="110" y1="400" x2="110" y2="280" stroke="#7F8C93" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="110" cy="400" r="12" fill="#FFFFFF" stroke="#7F8C93" stroke-width="4"/><text x="110.0" y="200.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#7F8C93" text-anchor="middle"><tspan x="110.0" dy="0.0">05/2017</tspan></text><text x="110.0" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="110.0" dy="0.0">Urotelial avanzado</tspan><tspan x="110.0" dy="17.6">tras platino (acelerada;</tspan><tspan x="110.0" dy="17.6">retirada en 2021)</tspan></text><rect x="66" y="156" width="88" height="24" rx="12" fill="#7F8C93" fill-opacity="0.16"/><text x="110.0" y="173.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#7F8C93" text-anchor="middle"><tspan x="110.0" dy="0.0">UE: no</tspan></text><line x1="235" y1="400" x2="235" y2="426" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="235" cy="400" r="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="235.5" y="476.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="235.5" dy="0.0">02/2018</tspan></text><text x="235.5" y="498.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="235.5" dy="0.0">CPNM estadio III</tspan><tspan x="235.5" dy="17.6">irresecable tras</tspan><tspan x="235.5" dy="17.6">quimiorradioterapia</tspan></text><rect x="191" y="432" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.16"/><text x="235.5" y="449.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="235.5" dy="0.0">UE: sí</tspan></text><line x1="361" y1="400" x2="361" y2="280" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="361" cy="400" r="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="360.9" y="200.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="360.9" dy="0.0">03/2020</tspan></text><text x="360.9" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="360.9" dy="0.0">Microcítico extendido:</tspan><tspan x="360.9" dy="17.6">1.ª línea con</tspan><tspan x="360.9" dy="17.6">etopósido y platino</tspan></text><rect x="317" y="156" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.16"/><text x="360.9" y="173.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="360.9" dy="0.0">UE: sí</tspan></text><line x1="486" y1="400" x2="486" y2="426" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="486" cy="400" r="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="486.4" y="476.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="486.4" dy="0.0">09/2022</tspan></text><text x="486.4" y="498.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="486.4" dy="0.0">Vías biliares</tspan><tspan x="486.4" dy="17.6">avanzado, con gem-</tspan><tspan x="486.4" dy="17.6">citabina y cisplatino</tspan></text><rect x="442" y="432" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.16"/><text x="486.4" y="449.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="486.4" dy="0.0">UE: sí</tspan></text><line x1="612" y1="400" x2="612" y2="280" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="612" cy="400" r="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="611.8" y="200.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="611.8" dy="0.0">10/2022</tspan></text><text x="611.8" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="611.8" dy="0.0">Hepatocarcinoma</tspan><tspan x="611.8" dy="17.6">irresecable, con</tspan><tspan x="611.8" dy="17.6">tremelimumab</tspan></text><rect x="568" y="156" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.16"/><text x="611.8" y="173.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="611.8" dy="0.0">UE: sí</tspan></text><line x1="737" y1="400" x2="737" y2="426" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="737" cy="400" r="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="737.3" y="476.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="737.3" dy="0.0">11/2022</tspan></text><text x="737.3" y="498.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="737.3" dy="0.0">CPNM metastásico,</tspan><tspan x="737.3" dy="17.6">con tremelimumab</tspan><tspan x="737.3" dy="17.6">y quimioterapia</tspan></text><rect x="693" y="432" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.16"/><text x="737.3" y="449.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="737.3" dy="0.0">UE: sí</tspan></text><line x1="863" y1="400" x2="863" y2="280" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="863" cy="400" r="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="862.7" y="200.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="862.7" dy="0.0">06/2024</tspan></text><text x="862.7" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="862.7" dy="0.0">Endometrio dMMR</tspan><tspan x="862.7" dy="17.6">avanzado, con carbo-</tspan><tspan x="862.7" dy="17.6">platino y paclitaxel</tspan></text><rect x="819" y="156" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.16"/><text x="862.7" y="173.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="862.7" dy="0.0">UE: sí</tspan></text><line x1="988" y1="400" x2="988" y2="426" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="988" cy="400" r="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="988.2" y="476.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="988.2" dy="0.0">08/2024</tspan></text><text x="988.2" y="498.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="988.2" dy="0.0">CPNM resecable:</tspan><tspan x="988.2" dy="17.6">antes (con QT) y</tspan><tspan x="988.2" dy="17.6">después de la cirugía</tspan></text><rect x="944" y="432" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.16"/><text x="988.2" y="449.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="988.2" dy="0.0">UE: sí</tspan></text><line x1="1114" y1="400" x2="1114" y2="280" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="1114" cy="400" r="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="1113.6" y="200.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="1113.6" dy="0.0">12/2024</tspan></text><text x="1113.6" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="1113.6" dy="0.0">Microcítico limitado</tspan><tspan x="1113.6" dy="17.6">tras quimio-</tspan><tspan x="1113.6" dy="17.6">rradioterapia</tspan></text><rect x="1070" y="156" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.16"/><text x="1113.6" y="173.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="1113.6" dy="0.0">UE: sí</tspan></text><line x1="1239" y1="400" x2="1239" y2="426" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="1239" cy="400" r="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="1239.1" y="476.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="1239.1" dy="0.0">03/2025</tspan></text><text x="1239.1" y="498.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="1239.1" dy="0.0">Vejiga músculo-</tspan><tspan x="1239.1" dy="17.6">invasivo: antes (con</tspan><tspan x="1239.1" dy="17.6">QT) y tras cistectomía</tspan></text><rect x="1195" y="432" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.16"/><text x="1239.1" y="449.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="1239.1" dy="0.0">UE: sí</tspan></text><line x1="1365" y1="400" x2="1365" y2="280" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="1365" cy="400" r="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="1364.5" y="200.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="1364.5" dy="0.0">11/2025</tspan></text><text x="1364.5" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="1364.5" dy="0.0">Gástrico o unión</tspan><tspan x="1364.5" dy="17.6">gastroesofágica</tspan><tspan x="1364.5" dy="17.6">resecable, con FLOT</tspan></text><rect x="1321" y="156" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.16"/><text x="1364.5" y="173.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="1364.5" dy="0.0">UE: sí</tspan></text><line x1="1490" y1="400" x2="1490" y2="426" stroke="#9A6A00" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="1490" cy="400" r="12" fill="#FFFFFF" stroke="#9A6A00" stroke-width="4"/><text x="1490.0" y="476.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#9A6A00" text-anchor="middle"><tspan x="1490.0" dy="0.0">05/2026</tspan></text><text x="1490.0" y="498.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="1490.0" dy="0.0">Vejiga no músculo-</tspan><tspan x="1490.0" dy="17.6">invasivo de alto</tspan><tspan x="1490.0" dy="17.6">riesgo, con BCG</tspan></text><rect x="1446" y="432" width="88" height="24" rx="12" fill="#9A6A00" fill-opacity="0.16"/><text x="1490.0" y="449.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#9A6A00" text-anchor="middle"><tspan x="1490.0" dy="0.0">UE: aún no</tspan></text><rect x="40" y="646" width="740" height="180" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="646" width="8" height="180" rx="4" fill="#9A6A00"/><text x="72.0" y="692.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#9A6A00" text-anchor="start"><tspan x="72.0" dy="0.0">Diferencias con la UE</tspan></text><text x="72.0" y="730.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">Solo en la UE: hepatocarcinoma en monoterapia y endometrio</tspan><tspan x="72.0" dy="24.6">pMMR con olaparib. CPNM estadio III: en la UE, solo si</tspan><tspan x="72.0" dy="24.6">PD-L1 ≥ 1 %. Solo en la FDA (05/2026): vejiga no músculo-invasivo.</tspan></text><rect x="820" y="646" width="740" height="180" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="820" y="646" width="8" height="180" rx="4" fill="#0072B2"/><text x="852.0" y="692.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="852.0" dy="0.0">Cómo leer esta lámina</tspan></text><text x="852.0" y="730.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">La FDA y la EMA aprueban por separado y en fechas distintas.</tspan><tspan x="852.0" dy="24.6">«UE: aún no» = no figura en la ficha de CIMA consultada.</tspan><tspan x="852.0" dy="24.6">En Costa Rica rige el registro sanitario nacional.</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: ficha técnica de Imfinzi (CIMA-AEMPS); FDA (Imfinzi, atezolizumab, nivolumab, pembrolizumab, cemiplimab, tremelimumab, ipilimumab); UniProt Q9NZQ7, Q15116; Reactome R-HSA-389948. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0). Drugs@FDA.</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión farmacológica</tspan></text></svg>