<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Durvalumab, lámina 6: Del ensayo a la práctica: valor y vida real</title><desc id="desc">Qué dicen las evaluaciones económicas y los estudios en la práctica clínica, con prioridad para Latinoamérica.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">DURVALUMAB · LÁMINA 6 DE 6 · VALOR Y VIDA REAL</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Del ensayo a la práctica: valor y vida real</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Qué dicen las evaluaciones económicas y los estudios en la práctica clínica, con prioridad para Latinoamérica.</tspan></text><text x="40.0" y="160.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="40.0" dy="0.0">¿Vale lo que cuesta? · Farmacoeconomía</tspan></text><rect x="40" y="178" width="740" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="40" y="178" width="6" height="112" rx="3" fill="#00785A"/><text x="62.0" y="206.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="62.0" dy="0.0">Chile: impacto presupuestario (CPNM estadio III)</tspan></text><text x="62.0" y="230.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="62.0" dy="0.0">Sistema público: de US$ 1,27 millones el primer año a US$ 8,5</tspan><tspan x="62.0" dy="21.0">millones el quinto, con ahorros parciales en otros gastos.</tspan></text><text x="62.0" y="278.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="62.0" dy="0.0">Modelo de supervivencia particionada · PMID 39058755, 2024</tspan></text><rect x="40" y="300" width="740" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="40" y="300" width="6" height="112" rx="3" fill="#00785A"/><text x="62.0" y="328.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="62.0" dy="0.0">Brasil y otros 3 países: ¿costo-efectivo?</tspan></text><text x="62.0" y="352.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="62.0" dy="0.0">Brasil: US$ 141 146 por AVAC frente a un umbral de US$ 22 251;</tspan><tspan x="62.0" dy="21.0">no fue costo-efectivo a ese precio (tampoco en EE. UU.).</tspan></text><text x="62.0" y="400.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="62.0" dy="0.0">Modelo de Markov con datos de PACIFIC · PMID 38814640, 2024</tspan></text><rect x="40" y="422" width="740" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="40" y="422" width="6" height="112" rx="3" fill="#00785A"/><text x="62.0" y="450.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="62.0" dy="0.0">Reino Unido (NICE): CPNM estadio III</tspan></text><text x="62.0" y="474.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="62.0" dy="0.0">Recomendado si PD-L1 ≥ 1 %, con acuerdo comercial (descuento</tspan><tspan x="62.0" dy="21.0">confidencial). Precio de lista: £2 466 por vial de 500 mg.</tspan></text><text x="62.0" y="522.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="62.0" dy="0.0">NICE TA798, 2022</tspan></text><rect x="40" y="544" width="740" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="40" y="544" width="6" height="112" rx="3" fill="#00785A"/><text x="62.0" y="572.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="62.0" dy="0.0">Reino Unido (NICE): vías biliares, con quimioterapia</tspan></text><text x="62.0" y="596.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="62.0" dy="0.0">Costo-efectividad estimada entre £20 000 y £30 000 por AVAC</tspan><tspan x="62.0" dy="21.0">(con ponderación por gravedad); recomendado con descuento.</tspan></text><text x="62.0" y="644.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="62.0" dy="0.0">NICE TA944, 2024</tspan></text><line x1="800" y1="140" x2="800" y2="830" stroke="#D3DCE0" stroke-width="1.5"/><text x="830.0" y="160.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="830.0" dy="0.0">¿Funciona igual fuera del ensayo? · Vida real</tspan></text><rect x="830" y="178" width="730" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="830" y="178" width="6" height="112" rx="3" fill="#0072B2"/><text x="852.0" y="206.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="852.0" dy="0.0">Brasil (LACOG 0120): 31 pacientes, CPNM estadio III</tspan></text><text x="852.0" y="230.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">Supervivencia global mediana de 34,9 meses, similar a PACIFIC;</tspan><tspan x="852.0" dy="21.0">supervivencia libre de progresión menor (9,9 meses).</tspan></text><text x="852.0" y="278.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="852.0" dy="0.0">Programa de acceso expandido, 7 centros · PMID 39813498, 2025</tspan></text><rect x="830" y="300" width="730" height="112" rx="10" fill="#FFFFFF" stroke="#D3DCE0"/><rect x="830" y="300" width="6" height="112" rx="3" fill="#0072B2"/><text x="852.0" y="328.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="852.0" dy="0.0">Internacional (PACIFIC-R): 1 153 pacientes</tspan></text><text x="852.0" y="352.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">A 5 años, el 49,2 % seguía vivo; supervivencia global mediana</tspan><tspan x="852.0" dy="21.0">de 59 meses.</tspan></text><text x="852.0" y="400.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="852.0" dy="0.0">Cohorte observacional retrospectiva · PMID 41643268, 2026</tspan></text><rect x="830" y="426" width="730" height="186" rx="12" fill="#FFF4EE" stroke="#9A6A00" stroke-width="1.4"/><text x="852.0" y="456.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#9A6A00" text-anchor="start"><tspan x="852.0" dy="0.0">Cómo leer estos datos</tspan></text><text x="852.0" y="480.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">• Precio, umbral y comparador cambian con el país y el año.</tspan><tspan x="852.0" dy="21.0">• Los estudios observacionales muestran asociaciones, no causas:</tspan><tspan x="852.0" dy="21.0">  confirman o matizan los ensayos, no los sustituyen.</tspan><tspan x="852.0" dy="21.0">• Costa Rica: los precios adjudicados por la CCSS están en SICOP</tspan><tspan x="852.0" dy="21.0">  (se añaden con la skill de estudio de mercado).</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: ficha técnica de Imfinzi (CIMA-AEMPS); FDA (Imfinzi, atezolizumab, nivolumab, pembrolizumab, cemiplimab, tremelimumab, ipilimumab); UniProt Q9NZQ7, Q15116; Reactome R-HSA-389948. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0).</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión farmacológica</tspan></text></svg>