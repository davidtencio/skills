<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Durvalumab, lámina 4: Del mecanismo al paciente</title><desc id="desc">Qué significa quitar el freno PD-L1: eficacia, farmacocinética de un anticuerpo y efectos inmunomediados.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">DURVALUMAB · LÁMINA 4 DE 6 · APLICACIÓN CLÍNICA</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Del mecanismo al paciente</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Qué significa quitar el freno PD-L1: eficacia, farmacocinética de un anticuerpo y efectos inmunomediados.</tspan></text><rect x="40" y="136" width="752" height="336" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="136" width="8" height="336" rx="4" fill="#00785A"/><image href="data:image/svg+xml;base64," x="652.0" y="156.0" width="110.0" height="112.0" preserveAspectRatio="xMidYMid meet"/><text x="72.0" y="182.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="72.0" dy="0.0">Efecto terapéutico</tspan></text><text x="72.0" y="220.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">• Reactiva linfocitos T que ya reconocían el tumor:</tspan><tspan x="72.0" dy="24.6">  ↑ activación y respuesta antitumoral.</tspan><tspan x="72.0" dy="24.6">• No mata por sí mismo: en modelos animales, su</tspan><tspan x="72.0" dy="24.6">  efecto desaparece sin linfocitos T.</tspan><tspan x="72.0" dy="24.6">• Solo o combinado (quimioterapia, tremelimumab,</tspan><tspan x="72.0" dy="24.6">  olaparib, BCG) en pulmón, vías biliares, hígado,</tspan><tspan x="72.0" dy="24.6">  endometrio, vejiga y estómago.</tspan></text><rect x="808" y="136" width="752" height="336" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="808" y="136" width="8" height="336" rx="4" fill="#D55E00"/><text x="840.0" y="182.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="840.0" dy="0.0">Error frecuente</tspan></text><text x="840.0" y="220.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="840.0" dy="0.0">«Durvalumab es quimioterapia: ataca al tumor.»</tspan><tspan x="840.0" dy="24.6">Falso: no es citotóxico ni induce CCDA; quita un</tspan><tspan x="840.0" dy="24.6">freno al linfocito T. Por eso sus efectos adversos</tspan><tspan x="840.0" dy="24.6">típicos son inflamatorios (inmunomediados), no los</tspan><tspan x="840.0" dy="24.6">de la quimioterapia.</tspan><tspan x="840.0" dy="24.6">&#160;</tspan><tspan x="840.0" dy="24.6">Para pensar: ¿por qué se evitan los corticoides</tspan><tspan x="840.0" dy="24.6">antes de empezar, pero se usan para tratar sus</tspan><tspan x="840.0" dy="24.6">efectos adversos?</tspan></text><rect x="40" y="488" width="752" height="336" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="488" width="8" height="336" rx="4" fill="#0072B2"/><text x="72.0" y="534.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="72.0" dy="0.0">Farmacocinética e interacciones</tspan></text><text x="72.0" y="572.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">• Perfusión intravenosa de 1 hora; p. ej., 1 500 mg</tspan><tspan x="72.0" dy="24.6">  cada 4 semanas o 10 mg/kg cada 2 semanas.</tspan><tspan x="72.0" dy="24.6">• Vss 5,6 L; semivida ~18 días; estado estacionario</tspan><tspan x="72.0" dy="24.6">  a las ~16 semanas.</tspan><tspan x="72.0" dy="24.6">• Se elimina por catabolismo proteico y unión a su</tspan><tspan x="72.0" dy="24.6">  diana, no por CYP: sin interacciones metabólicas.</tspan><tspan x="72.0" dy="24.6">• Antes de iniciar, evitar corticoides sistémicos</tspan><tspan x="72.0" dy="24.6">  (&gt; 10 mg/día de prednisona) e inmunosupresores.</tspan></text><rect x="808" y="488" width="752" height="336" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="808" y="488" width="8" height="336" rx="4" fill="#9C4F7A"/><text x="840.0" y="534.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#9C4F7A" text-anchor="start"><tspan x="840.0" dy="0.0">Efectos adversos</tspan></text><text x="840.0" y="572.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="840.0" dy="0.0">• ⚠ Inmunomediados, en cualquier órgano: neumonitis,</tspan><tspan x="840.0" dy="24.6">  colitis, hepatitis, tiroides, suprarrenal, diabetes</tspan><tspan x="840.0" dy="24.6">  tipo 1, nefritis, piel, miocarditis (puede ser mortal).</tspan><tspan x="840.0" dy="24.6">• Más frecuentes en monoterapia: tos (18 %), diarrea</tspan><tspan x="840.0" dy="24.6">  (15 %), erupción (15 %), hipotiroidismo (12 %).</tspan><tspan x="840.0" dy="24.6">• Manejo: suspender y corticoides según el grado.</tspan><tspan x="840.0" dy="24.6">• Embarazo: puede causar daño fetal; anticoncepción</tspan><tspan x="840.0" dy="24.6">  hasta 3 meses tras la última dosis.</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: ficha técnica de Imfinzi (CIMA-AEMPS); FDA (Imfinzi, atezolizumab, nivolumab, pembrolizumab, cemiplimab, tremelimumab, ipilimumab); UniProt Q9NZQ7, Q15116; Reactome R-HSA-389948. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0). PMID 25943534.</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión farmacológica</tspan></text></svg>