erif" font-size="14" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="701.4" dy="0.0">Mama HER2-bajo tras</tspan><tspan x="701.4" dy="18.2">quimioterapia; pulmón</tspan><tspan x="701.4" dy="18.2">con mutación de HER2</tspan></text><rect x="657" y="424" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.14"/><text x="701.4" y="441.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="701.4" dy="0.0">UE: sí</tspan></text><line x1="899" y1="400" x2="899" y2="288" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="899" cy="400" r="13" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="898.6" y="196.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="898.6" dy="0.0">04/2024</tspan></text><text x="898.6" y="220.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="898.6" dy="0.0">Tumores sólidos HER2</tspan><tspan x="898.6" dy="18.2">IHC 3+ sin otras</tspan><tspan x="898.6" dy="18.2">opciones (acelerada)</tspan></text><rect x="855" y="150" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.14"/><text x="898.6" y="167.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="898.6" dy="0.0">UE: sí</tspan></text><line x1="1096" y1="400" x2="1096" y2="420" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="1096" cy="400" r="13" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="1095.7" y="470.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="1095.7" dy="0.0">01/2025</tspan></text><text x="1095.7" y="494.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="1095.7" dy="0.0">Mama RH+, HER2-bajo</tspan><tspan x="1095.7" dy="18.2">o HER2-ultrabajo tras</tspan><tspan x="1095.7" dy="18.2">terapia endocrina</tspan></text><rect x="1052" y="424" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.14"/><text x="1095.7" y="441.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="1095.7" dy="0.0">UE: sí</tspan></text><line x1="1293" y1="400" x2="1293" y2="288" stroke="#9A6A00" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="1293" cy="400" r="13" fill="#FFFFFF" stroke="#9A6A00" stroke-width="4"/><text x="1292.9" y="196.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#9A6A00" text-anchor="middle"><tspan x="1292.9" dy="0.0">12/2025</tspan></text><text x="1292.9" y="220.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="1292.9" dy="0.0">Mama HER2+ metastásico:</tspan><tspan x="1292.9" dy="18.2">primera línea con</tspan><tspan x="1292.9" dy="18.2">pertuzumab</tspan></text><rect x="1249" y="150" width="88" height="24" rx="12" fill="#9A6A00" fill-opacity="0.18"/><text x="1292.9" y="167.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#9A6A00" text-anchor="middle"><tspan x="1292.9" dy="0.0">UE: aún no</tspan></text><line x1="1490" y1="400" x2="1490" y2="420" stroke="#9A6A00" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="1490" cy="400" r="13" fill="#FFFFFF" stroke="#9A6A00" stroke-width="4"/><text x="1490.0" y="470.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#9A6A00" text-anchor="middle"><tspan x="1490.0" dy="0.0">05/2026</tspan></text><text x="1490.0" y="494.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="1490.0" dy="0.0">Mama HER2+ temprana:</tspan><tspan x="1490.0" dy="18.2">neoadyuvante (antes de</tspan><tspan x="1490.0" dy="18.2">THP) y adyuvante</tspan></text><rect x="1446" y="424" width="88" height="24" rx="12" fill="#9A6A00" fill-opacity="0.18"/><text x="1490.0" y="441.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#9A6A00" text-anchor="middle"><tspan x="1490.0" dy="0.0">UE: aún no</tspan></text><rect x="40" y="640" width="740" height="186" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="640" width="8" height="186" rx="4" fill="#9A6A00"/><text x="72.0" y="686.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#9A6A00" text-anchor="start"><tspan x="72.0" dy="0.0">Lo último (FDA)</tspan></text><text x="72.0" y="724.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">12/2025: con pertuzumab en primera línea del cáncer de mama</tspan><tspan x="72.0" dy="24.6">HER2+ metastásico. 05/2026: neoadyuvante y adyuvante (con</tspan><tspan x="72.0" dy="24.6">enfermedad residual) en cáncer de mama HER2+ temprano.</tspan></text><rect x="820" y="640" width="740" height="186" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="820" y="640" width="8" height="186" rx="4" fill="#0072B2"/><text x="852.0" y="686.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="852.0" dy="0.0">Cómo leer esta lámina</tspan></text><text x="852.0" y="724.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">La FDA y la EMA aprueban por separado y en fechas distintas.</tspan><tspan x="852.0" dy="24.6">«UE: aún no» = no figura en la ficha de CIMA consultada.</tspan><tspan x="852.0" dy="24.6">En Costa Rica rige el registro sanitario nacional.</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: ficha técnica de Enhertu (CIMA-AEMPS); FDA (pertuzumab, T-DM1, lapatinib, tucatinib); UniProt P04626, P11387; Reactome R-HSA-1227986; PMID 27166974. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0). Estructuras: RDKit/PubChem. Drugs@FDA.</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión farmacológica</tspan></text></svg>