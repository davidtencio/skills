tica, sans-serif" font-size="14" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="60.0" dy="0.0">← Al principio: enfermedad metastásica ya tratada</tspan></text><text x="1540.0" y="600.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#56656D" text-anchor="end" font-style="italic"><tspan x="1540.0" dy="0.0">Ahora: primera línea y enfermedad temprana →</tspan></text><line x1="110" y1="400" x2="110" y2="288" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="110" cy="400" r="13" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="110.0" y="196.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="110.0" dy="0.0">12/2019</tspan></text><text x="110.0" y="220.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="110.0" dy="0.0">Mama HER2+ metastásico</tspan><tspan x="110.0" dy="18.2">tras ≥ 2 pautas anti-HER2</tspan><tspan x="110.0" dy="18.2">(aprobación acelerada)</tspan></text><rect x="66" y="150" width="88" height="24" rx="12" fill="#0072B2" fill-opacity="0.14"/><text x="110.0" y="167.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="110.0" dy="0.0">UE: sí</tspan></text><line x1="307" y1="400" x2="307" y2="420" stroke="#0072B2" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="307" cy="400" r="13" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><text x="307.1" y="470.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="307.1" dy="0.0">01/2021</tspan></text><text x="307.1" y="494.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="norma