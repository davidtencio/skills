<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Diabetes tipo 2, lámina 7: Criterios diagnósticos y confirmación</title><desc id="desc">Cuatro pruebas con los puntos de corte de las Normas de la ADA 2026; salvo hiperglucemia inequívoca, se confirma.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">DIABETES TIPO 2 · LÁMINA 7 DE 9 · DIAGNÓSTICO</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Criterios diagnósticos y confirmación</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Cuatro pruebas con los puntos de corte de las Normas de la ADA 2026; salvo hiperglucemia inequívoca, se confirma.</tspan></text><rect x="40" y="150" width="1520" height="74" fill="#E3F0F8" stroke="#D3DCE0"/><text x="60.0" y="196.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="60.0" dy="0.0">Prueba</tspan></text><text x="540.0" y="196.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="540.0" dy="0.0">Normal</tspan></text><text x="880.0" y="196.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="880.0" dy="0.0">Prediabetes</tspan></text><text x="1220.0" y="196.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="1220.0" dy="0.0">Diabetes</tspan></text><rect x="40" y="228" width="1520" height="74" fill="#FFFFFF" stroke="#D3DCE0"/><text x="60.0" y="274.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="60.0" dy="0.0">HbA1c</tspan></text><text x="540.0" y="274.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="540.0" dy="0.0">&lt; 5,7 %</tspan></text><text x="880.0" y="274.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#9A6A00" text-anchor="start"><tspan x="880.0" dy="0.0">5,7–6,4 %</tspan></text><text x="1220.0" y="274.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="1220.0" dy="0.0">≥ 6,5 %</tspan></text><rect x="40" y="306" width="1520" height="74" fill="#F5F8F9" stroke="#D3DCE0"/><text x="60.0" y="352.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="60.0" dy="0.0">Glucosa en ayunas (≥ 8 h)</tspan></text><text x="540.0" y="352.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="540.0" dy="0.0">&lt; 100 mg/dl</tspan></text><text x="880.0" y="352.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#9A6A00" text-anchor="start"><tspan x="880.0" dy="0.0">100–125 mg/dl</tspan></text><text x="1220.0" y="352.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="1220.0" dy="0.0">≥ 126 mg/dl</tspan></text><rect x="40" y="384" width="1520" height="74" fill="#FFFFFF" stroke="#D3DCE0"/><text x="60.0" y="430.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="60.0" dy="0.0">PTOG: glucosa a las 2 h</tspan></text><text x="540.0" y="430.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="540.0" dy="0.0">&lt; 140 mg/dl</tspan></text><text x="880.0" y="430.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#9A6A00" text-anchor="start"><tspan x="880.0" dy="0.0">140–199 mg/dl</tspan></text><text x="1220.0" y="430.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="1220.0" dy="0.0">≥ 200 mg/dl</tspan></text><rect x="40" y="462" width="1520" height="74" fill="#F5F8F9" stroke="#D3DCE0"/><text x="60.0" y="508.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="60.0" dy="0.0">Glucosa al azar con síntomas</tspan></text><text x="540.0" y="508.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="540.0" dy="0.0">—</tspan></text><text x="880.0" y="508.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#9A6A00" text-anchor="start"><tspan x="880.0" dy="0.0">—</tspan></text><text x="1220.0" y="508.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="1220.0" dy="0.0">≥ 200 mg/dl</tspan></text><rect x="40" y="560" width="740" height="230" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="560" width="8" height="230" rx="4" fill="#0072B2"/><text x="72.0" y="606.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="72.0" dy="0.0">Confirmación</tspan></text><text x="72.0" y="644.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">Salvo hiperglucemia inequívoca, hacen falta dos</tspan><tspan x="72.0" dy="29.0">resultados alterados: dos pruebas distintas a la vez</tspan><tspan x="72.0" dy="29.0">(p. ej., HbA1c y glucosa en ayunas) o la misma</tspan><tspan x="72.0" dy="29.0">prueba en dos momentos.</tspan></text><rect x="820" y="560" width="740" height="230" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="820" y="560" width="8" height="230" rx="4" fill="#0072B2"/><text x="852.0" y="606.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="852.0" dy="0.0">Qué mide cada prueba</tspan></text><text x="852.0" y="644.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">HbA1c: glucemia media de 2 a 3 meses, sin ayuno.</tspan><tspan x="852.0" dy="29.0">Ayunas: tras al menos 8 horas sin comer.</tspan><tspan x="852.0" dy="29.0">PTOG: glucosa 2 h después de una bebida azucarada.</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: Normas de Atención de la ADA 2026 (Diabetes Care, supl. 1); DeFronzo 2009 (PMID 19336687); Reactome R-HSA-422356, R-HSA-74752; UniProt; ADA y NIDDK (diagnóstico); OMS; FDA. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0).</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión clínica</tspan></text></svg>