<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Diabetes tipo 2, lámina 9: Estrategia: primero el riesgo cardiorrenal, luego la glucosa</title><desc id="desc">Resumen de las Normas de Atención de la ADA 2026 (secciones 6 y 9).</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">DIABETES TIPO 2 · LÁMINA 9 DE 9 · TRATAMIENTO</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Estrategia: primero el riesgo cardiorrenal, luego la glucosa</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Resumen de las Normas de Atención de la ADA 2026 (secciones 6 y 9).</tspan></text><rect x="40" y="150" width="1520" height="42" rx="12" fill="#EAF6F1" stroke="#00785A" stroke-width="1.5"/><text x="800.0" y="176.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#00785A" text-anchor="middle"><tspan x="800.0" dy="0.0">Base para todos: hábitos saludables, educación (DSMES) y determinantes sociales de la salud</tspan></text><polyline points="800.0,194.0 800.0,250.0" fill="none" stroke="#3E4C55" stroke-width="2.2" marker-end="url(#flecha)"/><rect x="560" y="252" width="480" height="76" rx="12" fill="#FFFFFF" stroke="#1F2A30" stroke-width="1.5"/><text x="800.0" y="283.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2A30" text-anchor="middle"><tspan x="800.0" dy="0.0">¿Enfermedad CV o alto riesgo CV,</tspan><tspan x="800.0" dy="22.1">insuficiencia cardiaca o ERC?</tspan></text><polyline points="560.0,290.0 420.0,290.0 420.0,350.0" fill="none" stroke="#3E4C55" stroke-width="2.2" marker-end="url(#flecha)"/><text x="470.0" y="280.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="470.0" dy="0.0">Sí</tspan></text><polyline points="1040.0,290.0 1180.0,290.0 1180.0,350.0" fill="none" stroke="#3E4C55" stroke-width="2.2" marker-end="url(#flecha)"/><text x="1110.0" y="280.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#56656D" text-anchor="start"><tspan x="1110.0" dy="0.0">No</tspan></text><rect x="40" y="354" width="760" height="330" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="354" width="8" height="330" rx="4" fill="#00785A"/><text x="72.0" y="400.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="72.0" dy="0.0">Protección cardiorrenal</tspan></text><text x="72.0" y="438.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">Con beneficio demostrado, sea cual sea la HbA1c:</tspan><tspan x="72.0" dy="26.1">• Enfermedad CV o alto riesgo CV: AR GLP-1 y/o iSGLT2.</tspan><tspan x="72.0" dy="26.1">• Insuficiencia cardiaca: iSGLT2; con obesidad e</tspan><tspan x="72.0" dy="26.1">  ICFEp sintomática, también tirzepatida o AR GLP-1.</tspan><tspan x="72.0" dy="26.1">• ERC (TFGe 20–60 y/o albuminuria): iSGLT2</tspan><tspan x="72.0" dy="26.1">  o AR GLP-1. Si la TFGe es &lt; 30: mejor AR GLP-1.</tspan></text><rect x="820" y="354" width="740" height="330" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="820" y="354" width="8" height="330" rx="4" fill="#0072B2"/><text x="852.0" y="400.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="852.0" dy="0.0">Control glucémico y peso</tspan></text><text x="852.0" y="438.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">• Objetivo para muchos adultos: HbA1c &lt; 7 %, sin</tspan><tspan x="852.0" dy="26.1">  hipoglucemia grave; individualizar.</tspan><tspan x="852.0" dy="26.1">• Metformina: eficacia alta, sin hipoglucemia;</tspan><tspan x="852.0" dy="26.1">  reducir la dosis con TFGe &lt; 45 y suspender con &lt; 30.</tspan><tspan x="852.0" dy="26.1">• Elegir según peso, comorbilidades y riesgo de</tspan><tspan x="852.0" dy="26.1">  hipoglucemia; combinar pronto si hace falta.</tspan></text><rect x="40" y="700" width="1520" height="120" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="700" width="8" height="120" rx="4" fill="#9A6A00"/><text x="72.0" y="746.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#9A6A00" text-anchor="start"><tspan x="72.0" dy="0.0">Si hace falta insulina</tspan></text><text x="72.0" y="784.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">Antes, un tratamiento basado en GLP-1. Insulina si hay síntomas, HbA1c &gt; 10 % o glucosa ≥ 300 mg/dl: basal de 0,1–0,2 U/kg/día, combinada con un AR GLP-1 o tirzepatida, sin</tspan><tspan x="72.0" dy="26.1">retirar los demás fármacos.</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: Normas de Atención de la ADA 2026 (Diabetes Care, supl. 1); DeFronzo 2009 (PMID 19336687); Reactome R-HSA-422356, R-HSA-74752; UniProt; ADA y NIDDK (diagnóstico); OMS; FDA. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0).</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión clínica</tspan></text></svg>