<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Neumonía nosocomial, lámina 11: Prevención: menos tubo, menos sedación, cabecera elevada</title><desc id="desc">Guía SHEA/IDSA/APIC 2022 para prevenir la NAV en adultos; la guía S3 remite la prevención a la KRINKO.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">NEUMONÍA NOSOCOMIAL · LÁMINA 11 DE 11 · PREVENCIÓN</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Prevención: menos tubo, menos sedación, cabecera elevada</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Guía SHEA/IDSA/APIC 2022 para prevenir la NAV en adultos; la guía S3 remite la prevención a la KRINKO.</tspan></text><rect x="40" y="150" width="1080" height="44" fill="#E3F0F8" stroke="#D3DCE0"/><text x="60.0" y="179.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="60.0" dy="0.0">Prácticas esenciales (SHEA/IDSA/APIC 2022)</tspan></text><text x="840.0" y="179.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="840.0" dy="0.0">Evidencia</tspan></text><text x="960.0" y="179.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="960.0" dy="0.0">Paso (lám. 3)</tspan></text><rect x="40" y="194" width="1080" height="72" fill="#FFFFFF" stroke="#D3DCE0"/><text x="60.0" y="224.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="60.0" dy="0.0">Evitar intubación y reintubación</tspan></text><text x="60.0" y="250.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="60.0" dy="0.0">Oxígeno de alto flujo o VNI si es seguro.</tspan></text><text x="840.0" y="236.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#00785A" text-anchor="start"><tspan x="840.0" dy="0.0">Alta</tspan></text><text x="1010.0" y="236.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="1010.0" dy="0.0">paso 1</tspan></text><rect x="40" y="266" width="1080" height="72" fill="#F5F8F9" stroke="#D3DCE0"/><text x="60.0" y="296.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="60.0" dy="0.0">Minimizar la sedación</tspan></text><text x="60.0" y="322.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="60.0" dy="0.0">Estrategias sin benzodiacepinas.</tspan></text><text x="840.0" y="308.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#00785A" text-anchor="start"><tspan x="840.0" dy="0.0">Alta</tspan></text><text x="1010.0" y="308.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="1010.0" dy="0.0">paso 5</tspan></text><rect x="40" y="338" width="1080" height="72" fill="#FFFFFF" stroke="#D3DCE0"/><text x="60.0" y="368.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="60.0" dy="0.0">Protocolo de retirada del ventilador</tspan></text><text x="60.0" y="394.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="60.0" dy="0.0">Valorar la extubación cada día.</tspan></text><text x="840.0" y="380.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#00785A" text-anchor="start"><tspan x="840.0" dy="0.0">Alta</tspan></text><text x="1010.0" y="380.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="1010.0" dy="0.0">paso 1</tspan></text><rect x="40" y="410" width="1080" height="72" fill="#F5F8F9" stroke="#D3DCE0"/><text x="60.0" y="440.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="60.0" dy="0.0">Movilización temprana</tspan></text><text x="60.0" y="466.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="60.0" dy="0.0">Ejercicio y movilización precoces.</tspan></text><text x="840.0" y="452.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#9A6A00" text-anchor="start"><tspan x="840.0" dy="0.0">Moderada</tspan></text><text x="1010.0" y="452.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="1010.0" dy="0.0">paso 5</tspan></text><rect x="40" y="482" width="1080" height="72" fill="#FFFFFF" stroke="#D3DCE0"/><text x="60.0" y="512.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="60.0" dy="0.0">Cabecera a 30–45°</tspan></text><text x="60.0" y="538.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="60.0" dy="0.0">Menos NAV; sin cambio en mortalidad.</tspan></text><text x="840.0" y="524.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#9A6A00" text-anchor="start"><tspan x="840.0" dy="0.0">Baja</tspan></text><text x="1010.0" y="524.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="1010.0" dy="0.0">paso 3–4</tspan></text><rect x="40" y="554" width="1080" height="72" fill="#F5F8F9" stroke="#D3DCE0"/><text x="60.0" y="584.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="60.0" dy="0.0">Cepillado dental diario</tspan></text><text x="60.0" y="610.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="60.0" dy="0.0">Sin clorhexidina.</tspan></text><text x="840.0" y="596.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#9A6A00" text-anchor="start"><tspan x="840.0" dy="0.0">Moderada</tspan></text><text x="1010.0" y="596.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="1010.0" dy="0.0">paso 3</tspan></text><rect x="40" y="626" width="1080" height="72" fill="#FFFFFF" stroke="#D3DCE0"/><text x="60.0" y="656.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="60.0" dy="0.0">Nutrición enteral temprana</tspan></text><text x="60.0" y="682.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="60.0" dy="0.0">Mejor que la parenteral temprana.</tspan></text><text x="840.0" y="668.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#00785A" text-anchor="start"><tspan x="840.0" dy="0.0">Alta</tspan></text><text x="1010.0" y="668.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="1010.0" dy="0.0">—</tspan></text><rect x="40" y="698" width="1080" height="72" fill="#F5F8F9" stroke="#D3DCE0"/><text x="60.0" y="728.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="60.0" dy="0.0">Circuito del ventilador</tspan></text><text x="60.0" y="754.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="60.0" dy="0.0">Cambiarlo solo si está sucio o falla.</tspan></text><text x="840.0" y="740.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#00785A" text-anchor="start"><tspan x="840.0" dy="0.0">Alta</tspan></text><text x="1010.0" y="740.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="1010.0" dy="0.0">—</tspan></text><rect x="1150" y="150" width="410" height="290" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="1150" y="150" width="8" height="290" rx="4" fill="#9A6A00"/><text x="1182.0" y="196.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#9A6A00" text-anchor="start"><tspan x="1182.0" dy="0.0">Medidas adicionales</tspan></text><text x="1182.0" y="234.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="1182.0" dy="0.0">Si no se controla con las</tspan><tspan x="1182.0" dy="24.6">esenciales: tubo con drenaje</tspan><tspan x="1182.0" dy="24.6">subglótico, traqueostomía</tspan><tspan x="1182.0" dy="24.6">temprana; descontaminación</tspan><tspan x="1182.0" dy="24.6">selectiva solo en UCI con</tspan><tspan x="1182.0" dy="24.6">poca resistencia.</tspan></text><rect x="1150" y="460" width="410" height="310" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="1150" y="460" width="8" height="310" rx="4" fill="#D55E00"/><text x="1182.0" y="506.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="1182.0" dy="0.0">No recomendado</tspan></text><text x="1182.0" y="544.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="1182.0" dy="0.0">• Clorhexidina oral</tspan><tspan x="1182.0" dy="24.6">• Probióticos</tspan><tspan x="1182.0" dy="24.6">• Balones ultrafinos o</tspan><tspan x="1182.0" dy="24.6">  cónicos</tspan><tspan x="1182.0" dy="24.6">• Control automático de</tspan><tspan x="1182.0" dy="24.6">  la presión del balón</tspan></text><rect x="40" y="786" width="1520" height="50" rx="12" fill="#EAF6F1" stroke="#00785A" stroke-width="1.5"/><text x="64.0" y="818.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="64.0" dy="0.0">También cuenta:</tspan></text><text x="210.0" y="818.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="210.0" dy="0.0">programas de uso racional de antibióticos en cada hospital (guía S3, recomendación 26).</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: guía S3 alemana 2024 (AWMF 020-013); ERS/ESICM/ESCMID/ALAT 2017 (PMID 28890434); Nat Commun 2024 (PMC11291905); SHEA/IDSA/APIC 2022 (PMC10903147); FDA. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0).</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión clínica</tspan></text></svg>