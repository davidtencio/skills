<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Neumonía nosocomial, lámina 4: Qué bacterias llegan: tiempo, exposición y riesgo de multirresistencia</title><desc id="desc">ERS/ESICM/ESCMID/ALAT 2017 (precoz y tardía); tabla 3 de la guía S3 2024 (factores de riesgo).</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">NEUMONÍA NOSOCOMIAL · LÁMINA 4 DE 11 · FISIOPATOLOGÍA</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Qué bacterias llegan: tiempo, exposición y riesgo de multirresistencia</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">ERS/ESICM/ESCMID/ALAT 2017 (precoz y tardía); tabla 3 de la guía S3 2024 (factores de riesgo).</tspan></text><rect x="40" y="150" width="760" height="250" rx="16" fill="#FFFFFF" stroke="#D3DCE0"/><text x="64.0" y="188.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="64.0" dy="0.0">El tiempo cambia los agentes probables</tspan></text><line x1="80" y1="256" x2="760" y2="256" stroke="#3E4C55" stroke-width="3"/><polyline points="700.0,256.0 770.0,256.0" fill="none" stroke="#3E4C55" stroke-width="2.2" marker-end="url(#flecha)"/><circle cx="80" cy="256" r="8" fill="#3E4C55"/><text x="80.0" y="234.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1F2A30" text-anchor="middle"><tspan x="80.0" dy="0.0">Ingreso</tspan></text><circle cx="330" cy="256" r="8" fill="#3E4C55"/><text x="330.0" y="234.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1F2A30" text-anchor="middle"><tspan x="330.0" dy="0.0">Día 4</tspan></text><circle cx="560" cy="256" r="8" fill="#3E4C55"/><text x="560.0" y="234.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1F2A30" text-anchor="middle"><tspan x="560.0" dy="0.0">Día 5 en adelante</tspan></text><text x="70.0" y="302.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#00785A" text-anchor="start"><tspan x="70.0" dy="0.0">Precoz, sin factores de riesgo:</tspan><tspan x="70.0" dy="25.2">S. pneumoniae, H. influenzae,</tspan><tspan x="70.0" dy="25.2">S. aureus sensible a meticilina</tspan></text><text x="450.0" y="302.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#D55E00" text-anchor="start"><tspan x="450.0" dy="0.0">Tardía: más riesgo de MMR</tspan><tspan x="450.0" dy="25.2">P. aeruginosa, A. baumannii,</tspan><tspan x="450.0" dy="25.2">SARM, otros bacilos gramnegativos</tspan></text><rect x="40" y="420" width="760" height="270" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="420" width="8" height="270" rx="4" fill="#7A7000"/><text x="72.0" y="466.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#7A7000" text-anchor="start"><tspan x="72.0" dy="0.0">La flora del paciente cambia en el hospital</tspan></text><text x="72.0" y="504.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">La flora oral pasa a estar dominada por bacilos</tspan><tspan x="72.0" dy="27.6">gramnegativos aerobios, que pueden aspirarse.</tspan><tspan x="72.0" dy="27.6">Vía exógena: equipos contaminados</tspan><tspan x="72.0" dy="27.6">(p. ej., humidificadores).</tspan></text><rect x="830" y="150" width="730" height="420" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="830" y="150" width="8" height="420" rx="4" fill="#D55E00"/><text x="862.0" y="196.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="862.0" dy="0.0">Factores de riesgo de MMR (guía S3)</tspan></text><text x="862.0" y="234.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="862.0" dy="0.0">• Antimicrobianos (&gt; 24 h) en los últimos 30 días</tspan><tspan x="862.0" dy="24.6">• Hospitalización ≥ 5 días antes del inicio</tspan><tspan x="862.0" dy="24.6">• Colonización por gramnegativos MMR o SARM*</tspan><tspan x="862.0" dy="24.6">• Shock séptico   • SDRA   • Hemodiálisis</tspan><tspan x="862.0" dy="24.6">• Atención en los últimos 12 meses en un país con</tspan><tspan x="862.0" dy="24.6">  alta prevalencia de gramnegativos MMR y SARM</tspan><tspan x="862.0" dy="24.6">Además, para P. aeruginosa:</tspan><tspan x="862.0" dy="24.6">• Enfermedad pulmonar estructural (EPOC avanzada,</tspan><tspan x="862.0" dy="24.6">  bronquiectasias) o colonización conocida</tspan></text><text x="860.0" y="556.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#56656D" text-anchor="start" font-style="italic"><tspan x="860.0" dy="0.0">* La mayoría de los colonizados no tendrá una neumonía por esos agentes.</tspan></text><rect x="830" y="590" width="730" height="100" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="830" y="590" width="8" height="100" rx="4" fill="#9A6A00"/><text x="862.0" y="636.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#9A6A00" text-anchor="start"><tspan x="862.0" dy="0.0">El momento no basta</tspan></text><text x="862.0" y="674.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="862.0" dy="0.0">Inmunosupresión, antibióticos u hospitalización previos también cuentan.</tspan></text><rect x="40" y="712" width="1520" height="80" rx="14" fill="#E3F0F8" stroke="#0072B2" stroke-width="1.5"/><text x="66.0" y="746.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="66.0" dy="0.0">Idea clave</tspan></text><text x="66.0" y="774.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="66.0" dy="0.0">Los factores de riesgo de MMR deciden el tratamiento empírico (lámina 9).</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: guía S3 alemana 2024 (AWMF 020-013); ERS/ESICM/ESCMID/ALAT 2017 (PMID 28890434); Nat Commun 2024 (PMC11291905); SHEA/IDSA/APIC 2022 (PMC10903147); FDA. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0).</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión clínica</tspan></text></svg>