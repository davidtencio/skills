<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Neumonía nosocomial, lámina 9: Tratamiento empírico: shock séptico y riesgo de multirresistencia</title><desc id="desc">Diagrama de flujo y recomendaciones 12–21 de la guía S3 2024 (en alemán; traducción propia).</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">NEUMONÍA NOSOCOMIAL · LÁMINA 9 DE 11 · TRATAMIENTO</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Tratamiento empírico: shock séptico y riesgo de multirresistencia</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Diagrama de flujo y recomendaciones 12–21 de la guía S3 2024 (en alemán; traducción propia).</tspan></text><rect x="650.0" y="145.0" width="300" height="50" rx="12" fill="#FFFFFF" stroke="#1F2A30" stroke-width="1.6"/><text x="800.0" y="176.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2A30" text-anchor="middle"><tspan x="800.0" dy="0.0">¿Shock séptico?</tspan></text><polyline points="650.0,170.0 420.0,170.0 420.0,214.0" fill="none" stroke="#3E4C55" stroke-width="2.2" marker-end="url(#flecha)"/><text x="520.0" y="160.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#56656D" text-anchor="start"><tspan x="520.0" dy="0.0">No</tspan></text><polyline points="950.0,170.0 1180.0,170.0 1180.0,214.0" fill="none" stroke="#3E4C55" stroke-width="2.2" marker-end="url(#flecha)"/><text x="1060.0" y="160.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="1060.0" dy="0.0">Sí</tspan></text><rect x="220.0" y="216.0" width="400" height="60" rx="12" fill="#FFFFFF" stroke="#1F2A30" stroke-width="1.6"/><text x="420.0" y="252.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2A30" text-anchor="middle"><tspan x="420.0" dy="0.0">¿Factores de riesgo de MMR?</tspan></text><rect x="960.0" y="216.0" width="440" height="60" rx="12" fill="#FFFFFF" stroke="#1F2A30" stroke-width="1.6"/><text x="1180.0" y="252.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2A30" text-anchor="middle"><tspan x="1180.0" dy="0.0">¿Otro factor de riesgo de MMR?</tspan></text><polyline points="360.0,278.0 230.0,316.0" fill="none" stroke="#3E4C55" stroke-width="2.2" marker-end="url(#flecha)"/><polyline points="480.0,278.0 610.0,316.0" fill="none" stroke="#3E4C55" stroke-width="2.2" marker-end="url(#flecha)"/><text x="281.0" y="296.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#56656D" text-anchor="end"><tspan x="281.0" dy="0.0">No</tspan></text><text x="559.0" y="296.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="559.0" dy="0.0">Sí</tspan></text><polyline points="1120.0,278.0 990.0,316.0" fill="none" stroke="#3E4C55" stroke-width="2.2" marker-end="url(#flecha)"/><polyline points="1240.0,278.0 1370.0,316.0" fill="none" stroke="#3E4C55" stroke-width="2.2" marker-end="url(#flecha)"/><text x="1041.0" y="296.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#56656D" text-anchor="end"><tspan x="1041.0" dy="0.0">No</tspan></text><text x="1319.0" y="296.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="1319.0" dy="0.0">Sí</tspan></text><rect x="40" y="320" width="370" height="270" rx="14" fill="#FFFFFF" stroke="#00785A" stroke-width="2"/><rect x="40" y="320" width="370" height="8" rx="4" fill="#00785A"/><text x="225.0" y="360.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#00785A" text-anchor="middle"><tspan x="225.0" dy="0.0">Monoterapia</tspan></text><text x="225.0" y="394.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="225.0" dy="0.0">Aminopenicilina con</tspan><tspan x="225.0" dy="23.0">inhibidor de β-lactamasa</tspan><tspan x="225.0" dy="23.0">(ampicilina/sulbactam)</tspan><tspan x="225.0" dy="23.0">o cefalosporina 3a</tspan><tspan x="225.0" dy="23.0">(cefotaxima, ceftriaxona)</tspan><tspan x="225.0" dy="23.0">o fluoroquinolona</tspan><tspan x="225.0" dy="23.0">(levofloxacino, moxifloxacino)</tspan></text><rect x="420" y="320" width="370" height="270" rx="14" fill="#FFFFFF" stroke="#9A6A00" stroke-width="2"/><rect x="420" y="320" width="370" height="8" rx="4" fill="#9A6A00"/><text x="605.0" y="360.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#9A6A00" text-anchor="middle"><tspan x="605.0" dy="0.0">Monoterapia</tspan></text><text x="605.0" y="394.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="605.0" dy="0.0">β-lactámico</tspan><tspan x="605.0" dy="23.0">antipseudomónico:</tspan><tspan x="605.0" dy="23.0">piperacilina/tazobactam</tspan><tspan x="605.0" dy="23.0">o cefepime</tspan><tspan x="605.0" dy="23.0">o meropenem</tspan><tspan x="605.0" dy="23.0">Combinación si la</tspan><tspan x="605.0" dy="23.0">resistencia local es alta</tspan></text><rect x="800" y="320" width="370" height="270" rx="14" fill="#FFFFFF" stroke="#9A6A00" stroke-width="2"/><rect x="800" y="320" width="370" height="8" rx="4" fill="#9A6A00"/><text x="985.0" y="360.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#9A6A00" text-anchor="middle"><tspan x="985.0" dy="0.0">Monoterapia</tspan></text><text x="985.0" y="394.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="985.0" dy="0.0">Carbapenémico:</tspan><tspan x="985.0" dy="23.0">meropenem</tspan><tspan x="985.0" dy="23.0">&#160;</tspan><tspan x="985.0" dy="23.0">(shock sin otro factor</tspan><tspan x="985.0" dy="23.0">de riesgo de MMR)</tspan></text><rect x="1180" y="320" width="370" height="270" rx="14" fill="#FFFFFF" stroke="#D55E00" stroke-width="2"/><rect x="1180" y="320" width="370" height="8" rx="4" fill="#D55E00"/><text x="1365.0" y="360.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#D55E00" text-anchor="middle"><tspan x="1365.0" dy="0.0">Combinación</tspan></text><text x="1365.0" y="394.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="middle"><tspan x="1365.0" dy="0.0">β-lactámico antipseudomónico</tspan><tspan x="1365.0" dy="23.0">más fluoroquinolona</tspan><tspan x="1365.0" dy="23.0">antipseudomónica</tspan><tspan x="1365.0" dy="23.0">(ciprofloxacino,</tspan><tspan x="1365.0" dy="23.0">levofloxacino)</tspan><tspan x="1365.0" dy="23.0">o aminoglucósido</tspan><tspan x="1365.0" dy="23.0">(tobramicina) o fosfomicina</tspan></text><rect x="40" y="606" width="1520" height="46" rx="12" fill="#E3F0F8" stroke="#0072B2" stroke-width="1.5"/><text x="800.0" y="632.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="800.0" dy="0.0">Si se sospecha SARM: añadir vancomicina o linezolid</tspan></text><rect x="40" y="670" width="1520" height="160" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="670" width="8" height="160" rx="4" fill="#00785A"/><text x="72.0" y="716.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#00785A" text-anchor="start"><tspan x="72.0" dy="0.0">Después: reevaluar a las 48–72 h</tspan></text><text x="72.0" y="754.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">Si no se confirma la neumonía, suspender. Si el paciente se estabiliza, desescalar aun sin agente identificado;</tspan><tspan x="72.0" dy="24.6">si hay agente, dirigir el tratamiento. Duración: 7–8 días si la respuesta es buena. En shock séptico: antibiótico en la 1.ª hora.</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: guía S3 alemana 2024 (AWMF 020-013); ERS/ESICM/ESCMID/ALAT 2017 (PMID 28890434); Nat Commun 2024 (PMC11291905); SHEA/IDSA/APIC 2022 (PMC10903147); FDA. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0).</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión clínica</tspan></text></svg>