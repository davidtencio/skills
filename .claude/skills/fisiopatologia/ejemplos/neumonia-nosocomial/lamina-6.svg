<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titulo desc"><title id="titulo">Neumonía nosocomial, lámina 6: Sospechar con criterios clínicos y confirmar el agente</title><desc id="desc">Recomendaciones 2–11 de la guía S3 2024; la broncoscopia no es superior a la toma no broncoscópica en la NAV.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C55"/></marker><marker id="flecha_bloqueada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><radialGradient id="g_citoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8FBFA"/><stop offset="1" stop-color="#E2EEEB"/></radialGradient><radialGradient id="g_nucleoplasma" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#D8E0EF"/></radialGradient><radialGradient id="g_receptor" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#E6F7F0"/><stop offset="1" stop-color="#97D2BC"/></radialGradient><radialGradient id="g_ligando" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFD780"/><stop offset="1" stop-color="#D99400"/></radialGradient><radialGradient id="g_farmaco" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#5AAEE0"/><stop offset="1" stop-color="#0067A3"/></radialGradient><radialGradient id="g_enzima" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F9E6EF"/><stop offset="1" stop-color="#D6A0BE"/></radialGradient><radialGradient id="g_hsp" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#B8C1C7"/></radialGradient><radialGradient id="g_coact" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1ECFA"/><stop offset="1" stop-color="#C3B4E4"/></radialGradient><radialGradient id="g_pol" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#F5EEE4"/><stop offset="1" stop-color="#CFB896"/></radialGradient><radialGradient id="g_mito" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCE9E0"/><stop offset="1" stop-color="#EBB59D"/></radialGradient><radialGradient id="g_prot" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCF3E2"/><stop offset="1" stop-color="#E9C88E"/></radialGradient><radialGradient id="g_ribo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#A4AEB4"/><stop offset="1" stop-color="#5F6A70"/></radialGradient><radialGradient id="g_nucleolo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#C9D1E6"/><stop offset="1" stop-color="#9DA9C9"/></radialGradient><radialGradient id="g_organo" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6ECEF"/></radialGradient></defs><rect width="1600" height="900" fill="#F5F8F9"/><rect x="0" y="0" width="1600" height="6" fill="#0072B2"/><text x="40.0" y="38.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="40.0" dy="0.0">NEUMONÍA NOSOCOMIAL · LÁMINA 6 DE 11 · DIAGNÓSTICO</tspan></text><text x="40.0" y="76.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="40.0" dy="0.0">Sospechar con criterios clínicos y confirmar el agente</tspan></text><text x="40.0" y="104.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Recomendaciones 2–11 de la guía S3 2024; la broncoscopia no es superior a la toma no broncoscópica en la NAV.</tspan></text><rect x="40" y="140" width="1520" height="120" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="140" width="8" height="120" rx="4" fill="#0072B2"/><text x="72.0" y="186.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="72.0" dy="0.0">Sospecha clínica (guía S3 2024): basta para empezar a tratar</tspan></text><text x="72.0" y="224.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">Infiltrado nuevo, persistente o progresivo en la radiografía  +  2 de 3: leucocitos &gt; 10 000 o &lt; 4000/µl · fiebre &gt; 38,3 °C · secreción purulenta</tspan></text><rect x="40" y="280" width="1520" height="56" fill="#E3F0F8" stroke="#D3DCE0"/><text x="58.0" y="316.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="58.0" dy="0.0">Prueba</tspan></text><text x="578.0" y="316.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="578.0" dy="0.0">Qué aporta</tspan></text><text x="1098.0" y="316.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0072B2" text-anchor="start"><tspan x="1098.0" dy="0.0">Cuándo</tspan></text><rect x="40" y="338" width="1520" height="56" fill="#FFFFFF" stroke="#D3DCE0"/><text x="58.0" y="374.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="58.0" dy="0.0">Hemocultivos</tspan></text><text x="578.0" y="374.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="578.0" dy="0.0">Bacteriemia y agente</tspan></text><text x="1098.0" y="374.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="1098.0" dy="0.0">Siempre</tspan></text><rect x="40" y="396" width="1520" height="56" fill="#F5F8F9" stroke="#D3DCE0"/><text x="58.0" y="432.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="58.0" dy="0.0">Cultivo semicuantitativo (aspirado o LBA)</tspan></text><text x="578.0" y="432.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="578.0" dy="0.0">Agente y antibiograma; el recuento orienta</tspan></text><text x="1098.0" y="432.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="1098.0" dy="0.0">Antes del antibiótico, sin retrasarlo</tspan></text><rect x="40" y="454" width="1520" height="56" fill="#FFFFFF" stroke="#D3DCE0"/><text x="58.0" y="490.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="58.0" dy="0.0">Tinción de Gram de la muestra</tspan></text><text x="578.0" y="490.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="578.0" dy="0.0">Valida la muestra; negativa sin antibiótico: alto VPN</tspan></text><text x="1098.0" y="490.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="1098.0" dy="0.0">Con el cultivo</tspan></text><rect x="40" y="512" width="1520" height="56" fill="#F5F8F9" stroke="#D3DCE0"/><text x="58.0" y="548.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="58.0" dy="0.0">PCR de SARS-CoV-2 e influenza</tspan></text><text x="578.0" y="548.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="578.0" dy="0.0">Virus respiratorios</tspan></text><text x="1098.0" y="548.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="1098.0" dy="0.0">Según la situación epidemiológica</tspan></text><rect x="40" y="570" width="1520" height="56" fill="#FFFFFF" stroke="#D3DCE0"/><text x="58.0" y="606.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="58.0" dy="0.0">Galactomanano en LBA (≥ 1,0)</tspan></text><text x="578.0" y="606.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="578.0" dy="0.0">Aspergillus</tspan></text><text x="1098.0" y="606.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="1098.0" dy="0.0">Si hay factores de riesgo de aspergilosis</tspan></text><rect x="40" y="628" width="1520" height="56" fill="#F5F8F9" stroke="#D3DCE0"/><text x="58.0" y="664.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2A30" text-anchor="start"><tspan x="58.0" dy="0.0">Radiografía; ecografía o TC</tspan></text><text x="578.0" y="664.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="578.0" dy="0.0">Infiltrado; complicaciones (empiema)</tspan></text><text x="1098.0" y="664.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="1098.0" dy="0.0">Ecografía o TC si la radiografía no aclara</tspan></text><rect x="40" y="700" width="740" height="136" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="40" y="700" width="8" height="136" rx="4" fill="#9A6A00"/><text x="72.0" y="746.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#9A6A00" text-anchor="start"><tspan x="72.0" dy="0.0">No de rutina</tspan></text><text x="72.0" y="784.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="72.0" dy="0.0">PCR múltiple bacteriana. Biomarcadores (PCT, proteína C</tspan><tspan x="72.0" dy="23.2">reactiva): para seguir la evolución, no para diagnosticar.</tspan></text><rect x="820" y="700" width="740" height="136" rx="16" fill="#FFFFFF" stroke="#D3DCE0" stroke-width="1.4"/><rect x="820" y="700" width="8" height="136" rx="4" fill="#56656D"/><text x="852.0" y="746.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#56656D" text-anchor="start"><tspan x="852.0" dy="0.0">Diagnóstico diferencial</tspan></text><text x="852.0" y="784.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1F2A30" text-anchor="start"><tspan x="852.0" dy="0.0">Atelectasias, insuficiencia cardiaca o sobrecarga de líquidos,</tspan><tspan x="852.0" dy="23.2">embolia pulmonar, hemorragia alveolar, neumonía organizada, SDRA.</tspan></text><text x="40.0" y="866.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#56656D" text-anchor="start"><tspan x="40.0" dy="0.0">Fuentes: guía S3 alemana 2024 (AWMF 020-013); ERS/ESICM/ESCMID/ALAT 2017 (PMID 28890434); Nat Commun 2024 (PMC11291905); SHEA/IDSA/APIC 2022 (PMC10903147); FDA. Ilustraciones: Servier Medical Art (CC BY 3.0 y 4.0).</tspan></text><text x="40.0" y="886.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="start"><tspan x="40.0" dy="0.0">Esquema simplificado y sin escala · Prototipo pendiente de revisión clínica</tspan></text></svg>